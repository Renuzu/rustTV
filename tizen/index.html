<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920" />
<title>rustTV</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="wait">rustTV verbindet mit <b id="waitUrl"></b> …<br /><br />
  <button id="change" class="ghost">Adresse ändern</button></div>

<div id="setup">
  <h1>rust<span>TV</span></h1>
  <p>Gib die Adresse deines rustTV-Servers ein (z.&nbsp;B. der Proxmox- oder Docker-Server im Heimnetz).<br />
     Beispiel: <b>http://192.168.1.50:8080</b></p>
  <input id="url" type="text" placeholder="http://192.168.1.50:8080" />
  <label><input id="framed" type="checkbox" /> Rahmen-Modus (nur ausprobieren, falls es ohne nicht klappt)</label>
  <div id="msg"></div>
  <button id="go">Verbinden</button>
</div>

<iframe id="frame" allow="autoplay; fullscreen"></iframe>

<script src="app.js"></script>
</body>
</html>
