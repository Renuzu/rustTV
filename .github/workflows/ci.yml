name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: command -v trunk || cargo install trunk --locked
      - name: Build web app
        run: cd web && trunk build --release
      - name: Test server
        run: cargo test -p rustv-server
