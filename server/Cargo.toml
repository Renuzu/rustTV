[package]
name = "rustv-server"
description = "Self-hosted backend for the ruSTv IPTV player (Xtream Codes proxy + web app)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rustv_server"
path = "src/lib.rs"

[[bin]]
name = "rustv"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
rust-embed = "8"
mime_guess = "2"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
